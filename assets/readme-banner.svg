<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 150" role="img" aria-labelledby="title desc">
  <title id="title">ALLCAPSJOE</title>
  <desc id="desc">ALLCAPSJOE // PROFILE TERMINAL</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020406" />
      <stop offset="50%" stop-color="#081018" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020404" />
      <stop offset="100%" stop-color="#061016" />
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="rgba(0,0,0,0)" />
      <rect y="4" width="8" height="4" fill="rgba(0,0,0,0.16)" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="150" fill="url(#bg)" />

  <!-- outer frame -->
  <rect x="52" y="14" width="1496" height="122" rx="18" fill="#0a1016" stroke="#162733" stroke-width="2" />

  <!-- screen -->
  <rect x="72" y="34" width="1456" height="102" rx="14" fill="url(#screen)" stroke="#1f3948" stroke-width="1.5" />
  <rect x="72" y="34" width="1456" height="102" rx="14" fill="url(#scanlines)" opacity="0.35" />

  <!-- title bar -->
  <rect x="72" y="34" width="1456" height="42" rx="14" fill="#081016" />
  <circle cx="100" cy="55" r="6" fill="#66ff99" opacity="0.95" />
  <circle cx="120" cy="55" r="6" fill="#66ff99" opacity="0.65" />
  <circle cx="140" cy="55" r="6" fill="#66ff99" opacity="0.35" />
  <text x="168" y="61" fill="#66ff99" font-size="17" font-family="Consolas, Menlo, Monaco, monospace" filter="url(#glow)">ALLCAPSJOE // PROFILE TERMINAL</text>
  <text x="1324" y="61" fill="#93c7b0" font-size="14" font-family="Consolas, Menlo, Monaco, monospace">ONLINE</text>

  <!-- prompt line -->
  <text x="98" y="108" fill="#66ff99" font-size="17" font-family="Consolas, Menlo, Monaco, monospace" filter="url(#glow)">visitor@allcapsjoe:~$</text>
  <rect x="395" y="94" width="10" height="16" fill="#66ff99" opacity="0.85" />

</svg>
