<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Console README</title>
  <desc id="desc">Generated CRT style console for GitHub profile README.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020406" />
      <stop offset="50%" stop-color="#081018" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020404" />
      <stop offset="100%" stop-color="#061016" />
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="rgba(0,0,0,0)" />
      <rect y="4" width="8" height="4" fill="rgba(0,0,0,0.16)" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)" />
  <rect x="52" y="34" width="1496" height="1128" rx="18" fill="#0a1016" stroke="#162733" stroke-width="2" />
  <rect x="72" y="56" width="1456" height="1088" rx="14" fill="url(#screen)" stroke="#1f3948" stroke-width="1.5" />
  <rect x="72" y="56" width="1456" height="1088" rx="14" fill="url(#scanlines)" opacity="0.35" />

  <rect x="72" y="56" width="1456" height="42" rx="14" fill="#081016" />
  <circle cx="100" cy="77" r="6" fill="#66ff99" opacity="0.95" />
  <circle cx="120" cy="77" r="6" fill="#66ff99" opacity="0.65" />
  <circle cx="140" cy="77" r="6" fill="#66ff99" opacity="0.35" />

  <text x="168" y="83" fill="#66ff99" font-size="17" font-family="Consolas, Menlo, Monaco, monospace" filter="url(#glow)">ALLCAPSJOE // PROFILE TERMINAL</text>
  <text x="1324" y="83" fill="#93c7b0" font-size="14" font-family="Consolas, Menlo, Monaco, monospace">ONLINE</text>

  <text x="98" y="132" fill="#66ff99" font-size="18" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">$ whoami</text>
  <text x="120" y="158" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Software engineer since 1995. Hardware install and help desk before ever writing a line of code.</text>
  <text x="120" y="184" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Learned HTML. Then JavaScript. Then server-side web. Then SQL. Then enterprise CMS. Then JS again.</text>
  <text x="120" y="210" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Led teams. Mentored engineers. Became a manager.</text>
  <text x="120" y="236" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Spent the last decade teaching junior devs to work on systems they didn't build and don't fully</text>
  <text x="120" y="262" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">understand. Turns out that is exactly the skill you need to work with AI.</text>
  <text x="98" y="306" fill="#66ff99" font-size="18" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">$ ./ai-operator.sh</text>
  <text x="120" y="332" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">[AI OPERATOR]</text>
  <text x="120" y="358" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">The 30 years matter: knowing what to ask for, when output is wrong, how to hand off complex work.</text>
  <text x="120" y="384" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Think of the Operators in The Matrix — not jacked in, sitting in the real world, reading the data.</text>
  <text x="120" y="410" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">They upload what the crew needs, monitor what's happening inside, pull the cord when things go wrong.</text>
  <text x="120" y="436" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Not inside the AI blindly accepting output. Above it — reading, directing, correcting, shaping.</text>
  <text x="120" y="462" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">The contribution graph has exploded. The output is real. The craft directing it is still mine.</text>
  <text x="120" y="488" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Tools change. Notepad became an IDE. The IDE became an AI pair. The craft stays the same.</text>
  <text x="98" y="532" fill="#66ff99" font-size="18" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">$ ls -la ./allcapsjoe/</text>
  <text x="120" y="558" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">allcapsjoe.com        Home base</text>
  <text x="120" y="584" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">blog.allcapsjoe.com   Linkstream of what I'm reading</text>
  <text x="120" y="610" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">tools.allcapsjoe.com  Developer utilities I've built</text>
  <text x="120" y="636" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">sites.allcapsjoe.com  Sites I've built</text>
  <text x="120" y="662" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">games.allcapsjoe.com  Web games — 6 complete</text>
  <text x="120" y="688" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">bigunclejoe.com       3D printing &amp; maker stuff</text>
  <text x="98" y="732" fill="#66ff99" font-size="18" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">$ tail -n 5 reading.log</text>
  <text x="120" y="758" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">World Monitor - Real-Time Global Intelligence Dashboard            2026-03-06</text>
  <text x="120" y="784" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Request to have your personal content removed from Google Search   2026-03-05</text>
  <text x="120" y="810" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">LLMs can unmask pseudonymous users at scale with surprising accuracy  2026-03-04</text>
  <text x="120" y="836" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Lock Scroll With a Vengeance - Unsung                             2026-03-04</text>
  <text x="120" y="862" fill="#c9ffdb" font-size="16" xml:space="preserve" font-family="Consolas, Menlo, Monaco, monospace">Astrophysicist Proposes Interstellar Mission to Study Black Holes  2026-03-04</text>

  <rect x="98" y="1106" width="1404" height="1.5" fill="#2a4c3a" />
  <text x="98" y="1138" fill="#66ff99" font-size="17" font-family="Consolas, Menlo, Monaco, monospace" filter="url(#glow)">visitor@allcapsjoe:~$</text>
  <rect x="395" y="1126" width="10" height="16" fill="#66ff99" opacity="0.85" />
</svg>
